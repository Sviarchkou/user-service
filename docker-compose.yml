version: "3"

services:
  postgres:
    image: postgres:latest
    container_name: user_service_db
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data