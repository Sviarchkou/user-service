spring:
  application:
    name: user-service
  liquibase:
    change-log: classpath:db/master.yml
    enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:9876/dev_db}
    username: ${DB_USERNAME:dev_user}
    password: ${DB_PASSWORD:dev_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
