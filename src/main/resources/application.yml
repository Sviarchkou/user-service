spring:
  application:
    name: user-service
  liquibase:
    change-log: classpath:db/master.yml
    enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: redis
    redis:
      cache-null-values: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_ENDPOINT:http://tempo:4318}
LOKI_URL: ${LOKI_URL:-http://localhost:3100/loki/api/v1/push}

security:
  constants:
    jwt:
      secret: ${JWT_SECRET}
    internal:
      secret: ${INTERNAL_SECRET}

