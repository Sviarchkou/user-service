spring:
  profiles:
    active: dev
  application:
    name: user-service
  liquibase:
    change-log: classpath:db/master.yml
    enabled: true
    #contexts: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:9876/dev_db}
    username: ${DB_USERNAME:devuser}
    password: ${DB_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
